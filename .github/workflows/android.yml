name: Build Android APK
# Builds an installable debug APK that opens your hosted Draft Duel server, and publishes it as a GitHub Release.
# Setup once: repo Settings > Secrets and variables > Actions > Variables > New variable: SERVER_URL = https://your-server.example.com
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check server URL
        run: |
          if [ -z "$SERVER_URL" ]; then echo "::error::Create the repository variable SERVER_URL (https address of your Draft Duel server)"; exit 1; fi
          case "$SERVER_URL" in https://*) ;; *) echo "::error::SERVER_URL must start with https://"; exit 1;; esac
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project
        working-directory: android-app
        run: |
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'app.draftduel.game',appName:'دراف دويل',webDir:'www',server:{url:process.env.SERVER_URL,androidScheme:'https',cleartext:false},android:{backgroundColor:'#0B1612'}},null,2))"
          npm install
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../DraftDuel.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Draft Duel APK ${{ github.run_number }}
          files: DraftDuel.apk
          make_latest: true
